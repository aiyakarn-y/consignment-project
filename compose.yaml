name: consignment-system
services:
  backend:
    user: "${CONSIGN_DOCKER_UID:-10001}:${CONSIGN_DOCKER_GID:-10001}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CONSIGN_DATA_DIR: /data
      CONSIGN_TEMPLATE_PATH: /app/resources/templates/Consign_sample.xlsx
      CONSIGN_SAMPLE_DIR: /data/samples
      CONSIGN_STORAGE_DRIVER: local
      PORT: "8100"
    volumes:
      - type: bind
        source: ${CONSIGN_DATA_DIR:-./data/local}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CONSIGN_BACKEND_URL: http://backend:8100
      PORT: "3117"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${CONSIGN_FRONTEND_PORT:-3117}:3117"
    depends_on:
      backend:
        condition: service_healthy
